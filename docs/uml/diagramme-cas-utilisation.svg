<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #1f2937; }
      .actor { font: 16px Arial, sans-serif; fill: #111827; }
      .usecase { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .line { stroke: #374151; stroke-width: 2; fill: none; }
      .system { fill: #f8fafc; stroke: #64748b; stroke-width: 2.2; }
      .label { font: 15px Arial, sans-serif; fill: #111827; }
    </style>
  </defs>

  <text x="600" y="45" text-anchor="middle" class="title">Diagramme de cas d'utilisation - Plateforme e-learning</text>

  <rect x="250" y="90" width="700" height="610" class="system"/>
  <text x="600" y="120" text-anchor="middle" class="actor">Système e-learning</text>

  <ellipse cx="520" cy="190" rx="145" ry="42" class="usecase"/>
  <text x="520" y="196" text-anchor="middle" class="label">S'inscrire / Se connecter</text>

  <ellipse cx="520" cy="290" rx="145" ry="42" class="usecase"/>
  <text x="520" y="296" text-anchor="middle" class="label">Consulter les leçons</text>

  <ellipse cx="520" cy="390" rx="145" ry="42" class="usecase"/>
  <text x="520" y="396" text-anchor="middle" class="label">Soumettre un exercice</text>

  <ellipse cx="520" cy="500" rx="145" ry="42" class="usecase"/>
  <text x="520" y="506" text-anchor="middle" class="label">Suivre la progression</text>

  <ellipse cx="760" cy="250" rx="145" ry="42" class="usecase"/>
  <text x="760" y="256" text-anchor="middle" class="label">Gérer les catégories</text>

  <ellipse cx="760" cy="350" rx="145" ry="42" class="usecase"/>
  <text x="760" y="356" text-anchor="middle" class="label">Publier des leçons</text>

  <ellipse cx="760" cy="450" rx="145" ry="42" class="usecase"/>
  <text x="760" y="456" text-anchor="middle" class="label">Corriger les exercices</text>

  <ellipse cx="760" cy="560" rx="145" ry="42" class="usecase"/>
  <text x="760" y="566" text-anchor="middle" class="label">Valider abonnement</text>

  <!-- Actors -->
  <circle cx="90" cy="250" r="18" stroke="#111827" fill="none" stroke-width="2"/>
  <line x1="90" y1="268" x2="90" y2="325" class="line"/>
  <line x1="60" y1="290" x2="120" y2="290" class="line"/>
  <line x1="90" y1="325" x2="65" y2="365" class="line"/>
  <line x1="90" y1="325" x2="115" y2="365" class="line"/>
  <text x="90" y="390" text-anchor="middle" class="actor">Apprenant</text>

  <circle cx="1090" cy="280" r="18" stroke="#111827" fill="none" stroke-width="2"/>
  <line x1="1090" y1="298" x2="1090" y2="355" class="line"/>
  <line x1="1060" y1="320" x2="1120" y2="320" class="line"/>
  <line x1="1090" y1="355" x2="1065" y2="395" class="line"/>
  <line x1="1090" y1="355" x2="1115" y2="395" class="line"/>
  <text x="1090" y="420" text-anchor="middle" class="actor">Admin</text>

  <!-- Associations -->
  <line x1="108" y1="260" x2="375" y2="200" class="line"/>
  <line x1="108" y1="270" x2="375" y2="290" class="line"/>
  <line x1="108" y1="285" x2="375" y2="390" class="line"/>
  <line x1="108" y1="300" x2="375" y2="500" class="line"/>

  <line x1="1072" y1="290" x2="905" y2="250" class="line"/>
  <line x1="1072" y1="305" x2="905" y2="350" class="line"/>
  <line x1="1072" y1="320" x2="905" y2="450" class="line"/>
  <line x1="1072" y1="335" x2="905" y2="560" class="line"/>
</svg>
