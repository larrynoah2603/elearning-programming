<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #1f2937; }
      .actor { font: 16px Arial, sans-serif; fill: #111827; }
      .msg { font: 14px Arial, sans-serif; fill: #111827; }
      .box { fill: #f8fafc; stroke: #475569; stroke-width: 2; rx: 8; }
      .lifeline { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; }
      .arrow { stroke: #1f2937; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .return { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 6 6; marker-end: url(#arrow2); }
      .activate { fill: #bfdbfe; stroke: #2563eb; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#1f2937"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#64748b"/>
    </marker>
  </defs>

  <text x="650" y="45" text-anchor="middle" class="title">Diagramme de séquence - Soumission d'exercice</text>

  <rect x="70" y="80" width="170" height="44" class="box"/><text x="155" y="108" text-anchor="middle" class="actor">Apprenant</text>
  <rect x="300" y="80" width="190" height="44" class="box"/><text x="395" y="108" text-anchor="middle" class="actor">Interface Web</text>
  <rect x="560" y="80" width="190" height="44" class="box"/><text x="655" y="108" text-anchor="middle" class="actor">LessonController</text>
  <rect x="820" y="80" width="190" height="44" class="box"/><text x="915" y="108" text-anchor="middle" class="actor">ExerciseSubmission</text>
  <rect x="1080" y="80" width="170" height="44" class="box"/><text x="1165" y="108" text-anchor="middle" class="actor">DB</text>

  <line x1="155" y1="124" x2="155" y2="700" class="lifeline"/>
  <line x1="395" y1="124" x2="395" y2="700" class="lifeline"/>
  <line x1="655" y1="124" x2="655" y2="700" class="lifeline"/>
  <line x1="915" y1="124" x2="915" y2="700" class="lifeline"/>
  <line x1="1165" y1="124" x2="1165" y2="700" class="lifeline"/>

  <rect x="648" y="210" width="14" height="250" class="activate"/>
  <rect x="908" y="300" width="14" height="170" class="activate"/>
  <rect x="1158" y="340" width="14" height="90" class="activate"/>

  <line x1="155" y1="170" x2="395" y2="170" class="arrow"/>
  <text x="273" y="162" text-anchor="middle" class="msg">1: Ouvrir exercice</text>

  <line x1="395" y1="230" x2="655" y2="230" class="arrow"/>
  <text x="525" y="222" text-anchor="middle" class="msg">2: POST /exercises/{id}/submit</text>

  <line x1="655" y1="320" x2="915" y2="320" class="arrow"/>
  <text x="785" y="312" text-anchor="middle" class="msg">3: createSubmission(data)</text>

  <line x1="915" y1="360" x2="1165" y2="360" class="arrow"/>
  <text x="1040" y="352" text-anchor="middle" class="msg">4: INSERT submission</text>

  <line x1="1165" y1="420" x2="915" y2="420" class="return"/>
  <text x="1040" y="412" text-anchor="middle" class="msg">5: id, status=submitted</text>

  <line x1="915" y1="470" x2="655" y2="470" class="return"/>
  <text x="785" y="462" text-anchor="middle" class="msg">6: Submission created</text>

  <line x1="655" y1="540" x2="395" y2="540" class="return"/>
  <text x="525" y="532" text-anchor="middle" class="msg">7: 302 redirect + flash success</text>

  <line x1="395" y1="610" x2="155" y2="610" class="return"/>
  <text x="273" y="602" text-anchor="middle" class="msg">8: Afficher confirmation</text>
</svg>
